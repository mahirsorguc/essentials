name: .NET 9 Build, Test & (Conditional) Pack

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build_test_pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # tag/commit eşlemesi için gerekli
          fetch-tags: true

      - name: Detect v* tag on this commit
        id: detect_tag
        shell: bash
        run: |
          TAGS=$(git tag --points-at "$GITHUB_SHA" | grep -E '^v' || true)
          if [ -n "$TAGS" ]; then
            echo "has_v_tag=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAGS" >> "$GITHUB_OUTPUT"
            echo "Found v* tag(s): $TAGS"
          else
            echo "has_v_tag=false" >> "$GITHUB_OUTPUT"
            echo "No v* tag on this commit."
          fi

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --no-restore --configuration Release

      - name: Run tests (Release)
        run: dotnet test --no-build --configuration Release --verbosity normal

      # Sadece commit v* tag'liyse paketle
      - name: Pack NuGet (.nupkg + .snupkg)
        if: steps.detect_tag.outputs.has_v_tag == 'true'
        run: >
          dotnet pack --no-build --configuration Release
          -p:ContinuousIntegrationBuild=true
          -p:IncludeSymbols=true
          -p:SymbolPackageFormat=snupkg
          -o artifacts

      - name: Upload package artifacts
        if: steps.detect_tag.outputs.has_v_tag == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/**/*.nupkg
            artifacts/**/*.snupkg
          if-no-files-found: error
