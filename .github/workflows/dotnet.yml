name: Build, Pack and Release (.nupkg) on v* tag

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-pack-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore & Build (Release)
        run: |
          dotnet restore
          dotnet build -c Release --no-restore

      - name: Detect .csproj files
        id: detect
        shell: bash
        run: |
          echo "Detected .csproj files:"
          mapfile -t projects < <(git ls-files "*.csproj")
          printf ' - %s\n' "${projects[@]}"

          if [ ${#projects[@]} -eq 0 ]; then
            echo "No .csproj files found. The project path might be incorrect or at a different repo level." >&2
            exit 1
          fi

          printf '%s\n' "${projects[@]}" > projects.txt

      - name: Pack all projects (.nupkg + .snupkg) using tag version
        env:
          RAW_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          VERSION="${RAW_TAG#v}"
          mkdir -p artifacts
          while IFS= read -r proj; do
            echo "Packing: $proj  -> Version: $VERSION"
            dotnet pack "$proj" -c Release \
              -p:ContinuousIntegrationBuild=true \
              -p:IncludeSymbols=true \
              -p:SymbolPackageFormat=snupkg \
              -p:PackageVersion="$VERSION" \
              -o artifacts
          done < projects.txt

      - name: Show artifacts
        run: ls -la artifacts

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/**/*.nupkg
            artifacts/**/*.snupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
